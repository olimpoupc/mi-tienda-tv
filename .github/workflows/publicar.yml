# The robot behind the admin panel: the panel starts it, it runs publicar.py on GitHub's servers.
name: Publicar
run-name: ${{ inputs.pedido }}

on:
  workflow_dispatch:
    inputs:
      pedido:
        description: "Nombre del pedido (lo pone el panel)"
        required: true
      accion:
        description: "apk | oficial | editar | quitar"
        required: true
      origen:
        description: "Rama buzon-… con el APK en partes, enlace oficial, o el paquete a editar o quitar"
        required: true
      descripcion:
        description: "Texto corto que verá la gente (vacío = dejar el que tiene)"
        required: false
        default: ""
      categoria:
        description: "Categoría (vacío = dejar la que tiene)"
        required: false
        default: ""
      detalle:
        description: "Descripción larga para la ficha (vacío = dejar la que tiene)"
        required: false
        default: ""
      novedades:
        description: "Qué trae esta versión"
        required: false
        default: ""
      destacada:
        description: "si | no | vacío para dejarla como está"
        required: false
        default: ""
      fijar:
        description: "Fijar la huella de un enlace oficial (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

# One change to the catalog at a time, so two publications never clash.
concurrency:
  group: tienda
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Inputs go through env, never straight into the script, so text can't turn into commands.
      ACCION: ${{ inputs.accion }}
      ORIGEN: ${{ inputs.origen }}
      DESC: ${{ inputs.descripcion }}
      CATEGORIA: ${{ inputs.categoria }}
      DETALLE: ${{ inputs.detalle }}
      NOVEDADES: ${{ inputs.novedades }}
      DESTACADA: ${{ inputs.destacada }}
      FIJAR: ${{ inputs.fijar }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar
        run: |
          set -e
          # Only the texts that were filled in are passed, so empty ones keep what the app already has.
          set --
          [ -n "$DESC" ] && set -- "$@" --desc "$DESC"
          [ -n "$CATEGORIA" ] && set -- "$@" --categoria "$CATEGORIA"
          [ -n "$DETALLE" ] && set -- "$@" --detalle "$DETALLE"
          [ -n "$NOVEDADES" ] && set -- "$@" --novedades "$NOVEDADES"
          case "$DESTACADA" in si|no) set -- "$@" --destacada "$DESTACADA" ;; esac
          case "$ACCION" in
            apk)
              # The panel leaves the APK in 24 MB parts (partes/000, 001…) on a temporary buzon-… branch.
              if ! printf '%s' "$ORIGEN" | grep -Eq '^buzon-[0-9]+-[a-z0-9]+$'; then
                echo "::error::El APK debe venir del buzón del panel."; exit 1
              fi
              git fetch --depth=1 origin "refs/heads/$ORIGEN:refs/remotes/origin/$ORIGEN"
              : > /tmp/app.apk
              for f in $(git ls-tree --name-only "origin/$ORIGEN" partes/ | sort); do
                git show "origin/$ORIGEN:$f" >> /tmp/app.apk
              done
              python3 publicar.py apk /tmp/app.apk "$@" ;;
            oficial)
              case "$ORIGEN" in https://*) ;; *) echo "::error::El enlace debe empezar con https://"; exit 1 ;; esac
              if [ "$FIJAR" = "true" ]; then
                python3 publicar.py oficial "$ORIGEN" --fijar "$@"
              else
                python3 publicar.py oficial "$ORIGEN" "$@"
              fi ;;
            editar)
              python3 publicar.py editar "$ORIGEN" "$@" ;;
            quitar)
              python3 publicar.py quitar "$ORIGEN" ;;
            *)
              echo "::error::Acción desconocida: $ACCION"; exit 1 ;;
          esac

      - name: Vaciar el buzón
        if: always() && inputs.accion == 'apk'
        run: |
          printf '%s' "$ORIGEN" | grep -Eq '^buzon-[0-9]+-[a-z0-9]+$' && gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ORIGEN" || true
